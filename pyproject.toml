[project]
name = "seixas-ai"
version = "0.1.0"
description = "Plataforma de Leitura de Processos Judiciais e Validação Automatizada de Acordos de Reembolso em Saúde"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pymupdf>=1.24.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "json-logic>=0.7.0a0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "minio>=7.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "fuzzywuzzy>=0.18.0",
    "python-levenshtein>=0.25.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "python-multipart>=0.0.9"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

